<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RGB-D 项目 · 检测与分割</title>
  <style>
    body { font: 16px/1.55 system-ui, sans-serif; max-width: 1050px; margin: 32px auto; padding: 0 18px; background: #f6f8fa; color: #17212b; }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .card { background: white; border: 1px solid #dce2e8; border-radius: 12px; padding: 20px; margin: 18px 0; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input[type=text], select { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #bdc7d1; border-radius: 7px; font: inherit; }
    button { background: #1565c0; color: white; border: 0; padding: 11px 18px; border-radius: 7px; font: inherit; cursor: pointer; margin-top: 16px; }
    button:disabled { opacity: .55; cursor: wait; }
    img { max-width: 100%; height: auto; }
    #overlay { border: 1px solid #dce2e8; border-radius: 8px; display: none; }
    #masks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    #masks a { display: block; background: #f6f8fa; padding: 8px; border-radius: 6px; text-decoration: none; color: #17212b; }
    #masks img { width: 100%; aspect-ratio: 4/3; object-fit: contain; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f1f4f7; padding: 12px; border-radius: 7px; }
    .muted { color: #5b6673; }
  </style>
</head>
<body>
  <h1>RGB-D 检测与实例分割</h1>
  <p class="muted">上传新的 RGB 图，点击运行后才调用 Grounding DINO＋SAM。当前模型仅使用 RGB；Depth 仍用于后续模块。</p>
  <div class="card">
    <label for="file">原始 RGB 图</label><input id="file" type="file" accept="image/*">
    <label for="prompt">目标 Prompt</label><input id="prompt" type="text" value="box. bag. bottle. carton. packet.">
    <label for="mode">检测模式</label><select id="mode"><option value="full">整图</option><option value="tiled">固定 2×2 裁剪</option></select>
    <button id="run">运行检测与分割</button>
    <p id="status" role="status"></p>
  </div>
  <div class="card"><h2>Mask 叠加图</h2><img id="overlay" alt="实例 Mask 叠加图"><p id="latency"></p></div>
  <div class="card"><h2>实例 Mask</h2><div id="masks"></div></div>
  <div class="card"><h2>结果 JSON</h2><pre id="json">尚未运行</pre></div>
  <script>
    const $ = id => document.getElementById(id);
    $('run').onclick = async () => {
      const file = $('file').files[0];
      if (!file) { $('status').textContent = '请先选择 RGB 图。'; return; }
      $('run').disabled = true; $('status').textContent = '模型正在推理，请等待…';
      try {
        const image_base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file);
        });
        const response = await fetch('/v1/segment', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({image_base64, prompt:$('prompt').value, mode:$('mode').value})});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '请求失败');
        $('overlay').src = result.overlay_ref; $('overlay').style.display = 'block';
        $('latency').textContent = `检出 ${result.instance_count} 个实例；整帧 ${Math.round(result.latency_ms.total)} ms（检测 ${Math.round(result.latency_ms.detection)} ms，分割 ${Math.round(result.latency_ms.segmentation)} ms）`;
        $('masks').replaceChildren();
        for (const item of result.instances) {
          const link = document.createElement('a'); link.href = item.mask_ref; link.target = '_blank';
          const image = document.createElement('img'); image.src = item.mask_ref; image.alt = `${item.instance_id} mask`;
          link.append(image, document.createTextNode(`${item.instance_id}: ${item.label} (${item.det_score})`)); $('masks').append(link);
        }
        $('json').textContent = JSON.stringify(result, null, 2);
        $('status').textContent = '完成。';
      } catch (error) { $('status').textContent = String(error); }
      finally { $('run').disabled = false; }
    };
  </script>
</body>
</html>
