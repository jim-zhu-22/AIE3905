<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>实例 Mask 人工修正</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:1100px;margin:24px auto;padding:0 15px;background:#f7f8fa;color:#18212b}h1{font-size:1.5rem}label{display:inline-block;margin:7px 12px 7px 0}button,input{font:inherit}button{padding:8px 13px;margin:7px 6px 7px 0}canvas{max-width:100%;height:auto;border:1px solid #aaa;touch-action:none;background:white}.bar{background:white;padding:15px;border:1px solid #ddd;border-radius:8px;margin-bottom:14px}.note{color:#596674}</style></head>
<body><h1>实例 Mask 人工修正</h1><p class="note">载入原始 RGB 和对应的模型 Mask PNG。绿色为当前 Mask；用“添加/擦除”修边，只标物体可见区域。下载后请让第二人复核，再登记为人工真值。</p>
<div class="bar">
 <label>原始 RGB <input id="rgb" type="file" accept="image/*"></label>
 <label>模型 Mask <input id="mask" type="file" accept="image/png"></label><br>
 <label><input name="tool" type="radio" value="add" checked>添加</label><label><input name="tool" type="radio" value="erase">擦除</label>
 <label>画笔半径 <input id="radius" type="range" min="1" max="50" value="8"><span id="radiusValue">8</span> px</label>
 <button id="download" disabled>下载修正 Mask PNG</button><span id="status"></span>
</div><canvas id="view"></canvas>
<script>
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');
let rgb=null,mask=null,w=0,h=0,drawing=false,scheduled=false;
const readImage=file=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=URL.createObjectURL(file)});
async function load(){if(!$('rgb').files[0]||!$('mask').files[0])return;try{
 rgb=await readImage($('rgb').files[0]);const m=await readImage($('mask').files[0]);w=rgb.naturalWidth;h=rgb.naturalHeight;
 if(m.naturalWidth!==w||m.naturalHeight!==h)throw Error('Mask 与原图尺寸不一致');
 canvas.width=w;canvas.height=h;const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;const t=tmp.getContext('2d',{willReadFrequently:true});t.drawImage(m,0,0);
 const rgba=t.getImageData(0,0,w,h).data;mask=new Uint8Array(w*h);for(let i=0;i<mask.length;i++)mask[i]=rgba[i*4]>127?1:0;
 $('download').disabled=false;$('status').textContent=`已载入 ${w}×${h}`;render();
}catch(e){$('status').textContent=String(e)}}
$('rgb').onchange=load;$('mask').onchange=load;$('radius').oninput=()=>{$('radiusValue').textContent=$('radius').value};
function render(){if(!rgb||!mask)return;ctx.drawImage(rgb,0,0);const frame=ctx.getImageData(0,0,w,h),d=frame.data;for(let i=0;i<mask.length;i++)if(mask[i]){const j=i*4;d[j]=Math.round(.55*d[j]);d[j+1]=Math.round(.55*d[j+1]+.45*255);d[j+2]=Math.round(.55*d[j+2]);}ctx.putImageData(frame,0,0)}
function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;render()})}
function paint(e){if(!mask)return;const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*w/r.width),y=Math.floor((e.clientY-r.top)*h/r.height),radius=+$('radius').value,add=document.querySelector('input[name=tool]:checked').value==='add';for(let yy=Math.max(0,y-radius);yy<Math.min(h,y+radius+1);yy++)for(let xx=Math.max(0,x-radius);xx<Math.min(w,x+radius+1);xx++)if((xx-x)**2+(yy-y)**2<=radius*radius)mask[yy*w+xx]=add?1:0;schedule()}
canvas.onpointerdown=e=>{if(!mask)return;drawing=true;canvas.setPointerCapture(e.pointerId);paint(e)};canvas.onpointermove=e=>{if(drawing)paint(e)};canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false;
$('download').onclick=()=>{const out=document.createElement('canvas');out.width=w;out.height=h;const c=out.getContext('2d'),pixels=c.createImageData(w,h);for(let i=0;i<mask.length;i++){const v=mask[i]?255:0,j=i*4;pixels.data[j]=v;pixels.data[j+1]=v;pixels.data[j+2]=v;pixels.data[j+3]=255}c.putImageData(pixels,0,0);out.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='corrected_instance_mask.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};
</script></body></html>
