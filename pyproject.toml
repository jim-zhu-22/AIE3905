[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aie3905-perception"
version = "0.5.0"
description = "Modular RGB-D instance perception pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "Pillow>=10,<13", "torch>=2.9,<2.10",
  "torchvision>=0.24,<0.25", "transformers==4.57.1", "ultralytics==8.3.221"
]

[project.scripts]
aie-perception = "perception.pipeline.run:main"
aie-doctor = "perception.doctor:main"

[project.optional-dependencies]
training = ["scikit-learn>=1.5,<2"]
api = ["fastapi==0.141.1", "uvicorn==0.54.0", "python-multipart==0.0.32", "pydantic==2.11.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["perception*", "material_recognition*", "api_service*"]

[tool.setuptools.package-data]
api_service = ["*.html", "logging.json", "modules.default.json", "static/*.js", "static/*.css"]
